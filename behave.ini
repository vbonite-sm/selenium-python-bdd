[behave]
# Behave configuration file
paths = features
show_skipped = false
show_timings = true
color = true
summary = true

# Formatters
format = pretty
outfiles = reports/behave-report.txt

# Tags
default_tags = 
exclude_tags = wip,skip

# Logging
logging_level = INFO
logging_format = %(levelname)s:%(name)s:%(message)s
